name: CI - Build and Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build ./Swa.Analyzers.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx --locked-mode

      # dotnet test contra a .slnx atualmente falha antes da descoberta de testes quando
      # o MSBuild usa múltiplos nós. Mantemos a orquestração em nó único enquanto
      # preservamos a cobertura completa de testes da solução.
      - name: Test
        run: dotnet test ./Swa.Analyzers.slnx --configuration Release -m:1
