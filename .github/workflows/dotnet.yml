name: PR Validation

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'Swa.Analyzers.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx

      - name: Build
        run: dotnet build ./Swa.Analyzers.slnx --configuration Release --no-restore -m:1

      - name: Test
        run: dotnet test ./Swa.Analyzers.slnx --configuration Release --no-build -m:1
