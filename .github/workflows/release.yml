name: Release - Package and GitHub Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build ./Swa.Analyzers.slnx --configuration Release --no-restore

      - name: Read package version
        id: package_version
        shell: bash
        run: |
          version="$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' src/Swa.Analyzers.Core/Swa.Analyzers.Core.csproj)"

          if [ -z "$version" ]; then
            echo "VersionPrefix nao encontrado em src/Swa.Analyzers.Core/Swa.Analyzers.Core.csproj"
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "VersionPrefix invalido: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      # dotnet test against the .slnx currently fails before test discovery when
      # MSBuild runs with multiple nodes. Keep orchestration single-node while
      # preserving full solution test coverage.
      - name: Test
        run: dotnet test ./Swa.Analyzers.slnx --configuration Release --no-build -m:1

      - name: Pack analyzer
        run: dotnet pack ./src/Swa.Analyzers.Core/Swa.Analyzers.Core.csproj --configuration Release --no-build --output ./artifacts/packages /p:PackageVersion=${{ steps.package_version.outputs.version }}

      - name: Attest NuGet packages
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Prepare release tag
        id: release_tag
        shell: bash
        run: |
          tag="v${{ needs.validate.outputs.version }}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

      - name: Create GitHub release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setFailed(`Release ${tag} already exists. Refusing to overwrite release assets.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 10,
            });

            const previousRelease = releases.data.find(release =>
              !release.draft &&
              !release.prerelease &&
              release.tag_name !== tag
            );

            const previousTag = previousRelease?.tag_name;

            if (previousTag) {
              core.notice(`Generating release notes from previous tag: ${previousTag}`);
            } else {
              core.notice('No previous release tag found. Generating notes without previous_tag_name.');
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });

              core.setFailed(`Tag ${tag} already exists. Refusing to create release for an existing version.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            const releaseNotesRequest = {
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
            };

            if (previousTag) {
              releaseNotesRequest.previous_tag_name = previousTag;
            }

            const notes = await github.rest.repos.generateReleaseNotes(releaseNotesRequest);

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Swa.Analyzers ${tag}`,
              body: notes.data.body,
              target_commitish: context.sha,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });

      - name: Attach NuGet packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob

          files=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum pacote .nupkg ou .snupkg encontrado em artifacts/packages"
            exit 1
          fi

          gh release upload "${{ steps.release_tag.outputs.tag }}" "${files[@]}"

      # Futuro: publicar no NuGet.org somente apos revisao de governanca.
      # Para habilitar:
      # 1. Criar o secret NUGET_API_KEY com escopo minimo no repositorio.
      # 2. Usar environment protegido com revisores para publicacao.
      # 3. Manter --skip-duplicate.
      # 4. Descomentar este step apenas apos aprovacao do fluxo.
      #
      # - name: Publish to NuGet
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   shell: bash
      #   run: |
      #     dotnet nuget push "artifacts/packages/*.nupkg" \
      #       --api-key "$NUGET_API_KEY" \
      #       --source https://api.nuget.org/v3/index.json \
      #       --skip-duplicate
