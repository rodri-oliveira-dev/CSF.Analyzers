name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build ./Swa.Analyzers.slnx --configuration Release --no-restore

      # dotnet test against the .slnx currently fails before test discovery when
      # MSBuild runs with multiple nodes. Keep orchestration single-node while
      # preserving full solution test coverage.
      - name: Test
        run: dotnet test ./Swa.Analyzers.slnx --configuration Release --no-build -m:1

      - name: Pack analyzer
        run: dotnet pack ./src/Swa.Analyzers.Core/Swa.Analyzers.Core.csproj --configuration Release --no-build --output ./artifacts/packages /p:Version=0.1.${{ github.run_number }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Prepare release tag
        id: release_tag
        shell: bash
        run: |
          timestamp="$(date -u +'%Y%m%d-%H%M')"
          short_sha="${GITHUB_SHA::7}"
          tag="release-${timestamp}-${short_sha}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.notice(`Release ${tag} already exists. Skipping creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 10,
            });

            const previousRelease = releases.data.find(release =>
              !release.draft &&
              !release.prerelease &&
              release.tag_name !== tag
            );

            const previousTag = previousRelease?.tag_name;

            if (previousTag) {
              core.notice(`Generating release notes from previous tag: ${previousTag}`);
            } else {
              core.notice('No previous release tag found. Generating notes without previous_tag_name.');
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });

              core.notice(`Tag ${tag} already exists. Creating release from existing tag.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            const releaseNotesRequest = {
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
            };

            if (previousTag) {
              releaseNotesRequest.previous_tag_name = previousTag;
            }

            const notes = await github.rest.repos.generateReleaseNotes(releaseNotesRequest);

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              body: notes.data.body,
              target_commitish: context.sha,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });

      - name: Attach NuGet packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob

          files=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum pacote .nupkg ou .snupkg encontrado em artifacts/packages"
            exit 1
          fi

          gh release upload "${{ steps.release_tag.outputs.tag }}" "${files[@]}" --clobber
