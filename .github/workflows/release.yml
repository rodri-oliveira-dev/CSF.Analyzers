name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build ./Swa.Analyzers.slnx --configuration Release --no-restore

      # dotnet test against the .slnx currently fails before test discovery when
      # MSBuild runs with multiple nodes. Keep orchestration single-node while
      # preserving full solution test coverage.
      - name: Test
        run: dotnet test ./Swa.Analyzers.slnx --configuration Release --no-build -m:1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Prepare release tag
        id: release_tag
        shell: bash
        run: |
          timestamp="$(date -u +'%Y%m%d-%H%M')"
          short_sha="${GITHUB_SHA::7}"
          tag="release-${timestamp}-${short_sha}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.notice(`Release ${tag} already exists. Skipping creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.notice(`Tag ${tag} already exists. Creating release from existing tag.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              target_commitish: context.sha,
              generate_release_notes: true,
            });
