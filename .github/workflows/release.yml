name: Release - Package and GitHub Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Validate GitVersion package version
        shell: bash
        run: |
          version="${{ steps.gitversion.outputs.semVer }}"

          if [ -z "$version" ]; then
            echo "GitVersion não calculou a versão SemVer."
            exit 1
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "GitVersion calculou uma versão inválida para PackageVersion: $version"
            exit 1
          fi

          echo "GitVersion package version: $version"

      - name: Check release version is unused
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = 'v${{ steps.gitversion.outputs.semVer }}';
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setFailed(`Release ${tag} already exists. GitVersion calculated a version that was already released.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });

              core.setFailed(`Tag ${tag} already exists. Release tags are immutable for this workflow.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./CSF.Analyzers.slnx --locked-mode

      - name: Build
        run: dotnet build ./CSF.Analyzers.slnx --configuration Release --no-restore

      # dotnet test contra a .slnx atualmente falha antes da descoberta de testes quando
      # o MSBuild usa múltiplos nós. Mantemos a orquestração em nó único enquanto
      # preservamos a cobertura completa de testes da solução.
      - name: Test
        run: dotnet test ./CSF.Analyzers.slnx --configuration Release --no-build -m:1

      - name: Validate release consistency
        shell: pwsh
        run: ./scripts/Validate-Release.ps1

      - name: Pack analyzers
        shell: bash
        run: |
          rm -rf ./artifacts/packages
          dotnet pack ./src/CSF.Analyzers.Reliability/CSF.Analyzers.Reliability.csproj --configuration Release --no-build --output ./artifacts/packages /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}
          dotnet pack ./src/CSF.Analyzers.Architecture/CSF.Analyzers.Architecture.csproj --configuration Release --no-build --output ./artifacts/packages /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}
          dotnet pack ./src/CSF.Analyzers.Testing/CSF.Analyzers.Testing.csproj --configuration Release --no-build --output ./artifacts/packages /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}

      - name: Inspect NuGet packages
        shell: pwsh
        run: ./scripts/Inspect-NuGetPackages.ps1 -PackageDirectory ./artifacts/packages -Version '${{ steps.gitversion.outputs.semVer }}'

      - name: Attest NuGet packages
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Prepare release tag
        id: release_tag
        shell: bash
        run: |
          tag="v${{ needs.validate.outputs.version }}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Release tag: ${tag}"

      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.setFailed(`Release ${tag} already exists. GitVersion calculated a version that was already released. Check existing tags and the semantic commit history before rerunning the release pipeline.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 10,
            });

            const previousRelease = releases.data.find(release =>
              !release.draft &&
              !release.prerelease &&
              release.tag_name !== tag
            );

            const previousTag = previousRelease?.tag_name;

            if (previousTag) {
              core.notice(`Generating release notes from previous tag: ${previousTag}`);
            } else {
              core.notice('No previous release tag found. Generating notes without previous_tag_name.');
            }

            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${tag}`,
              });

              core.setFailed(`Tag ${tag} already exists. GitVersion calculated a version that was already released. Check existing tags and the semantic commit history before rerunning the release pipeline.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            const releaseNotesRequest = {
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
            };

            if (previousTag) {
              releaseNotesRequest.previous_tag_name = previousTag;
            }

            const notes = await github.rest.repos.generateReleaseNotes(releaseNotesRequest);

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `CSF.Analyzers ${tag}`,
              body: notes.data.body,
              target_commitish: context.sha,
              draft: false,
              prerelease: false,
              generate_release_notes: false,
            });

      - name: Attach NuGet packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob

          files=(artifacts/packages/*.nupkg artifacts/packages/*.snupkg)

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum pacote .nupkg ou .snupkg encontrado em artifacts/packages"
            exit 1
          fi

          gh release upload "${{ steps.release_tag.outputs.tag }}" "${files[@]}"

      # Futuro: publicar no NuGet.org somente após revisão de governança.
      # Para habilitar:
      # 1. Criar o secret NUGET_API_KEY com escopo mínimo no repositório.
      # 2. Usar environment protegido com revisores para publicação.
      # 3. Manter --skip-duplicate.
      # 4. Descomentar este step apenas após aprovação do fluxo.
      #
      # - name: Publish to NuGet
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   shell: bash
      #   run: |
      #     dotnet nuget push "artifacts/packages/*.nupkg" \
      #       --api-key "$NUGET_API_KEY" \
      #       --source https://api.nuget.org/v3/index.json \
      #       --skip-duplicate
