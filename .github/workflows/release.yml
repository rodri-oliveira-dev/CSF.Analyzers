name: Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'Swa.Analyzers.slnx') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Swa.Analyzers.slnx

      - name: Build
        run: dotnet build ./Swa.Analyzers.slnx --configuration Release --no-restore -m:1

      - name: Test
        run: dotnet test ./Swa.Analyzers.slnx --configuration Release --no-build -m:1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Prepare release tag
        id: release_tag
        shell: bash
        run: |
          timestamp="$(date -u +'%Y%m%d-%H%M')"
          short_sha="${GITHUB_SHA::7}"
          tag="release-${timestamp}-${short_sha}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.release_tag.outputs.tag }}';
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.notice(`Release ${tag} already exists. Skipping creation.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.notice(`Tag ${tag} already exists. Creating release from existing tag.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
            }

            await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: tag,
              target_commitish: context.sha,
              generate_release_notes: true,
            });
